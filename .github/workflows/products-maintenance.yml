name: Maintain Product Catalog
on:
  workflow_dispatch:
    inputs:
      rotate:
        description: Rotate weekly Top 10
        required: false
        default: "false"
  schedule:
    - cron: "30 0 * * *"
    - cron: "0 1 * * 1"
permissions:
  contents: write
concurrency:
  group: product-catalog-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check published product links
        run: node scripts/check-product-links.mjs
      - name: Rotate weekly Top 10
        if: github.event.schedule == '0 1 * * 1' || inputs.rotate == 'true'
        run: node scripts/rotate-product-top10.mjs
      - name: Validate and build
        run: npm run check && npm run build
      - name: Publish reviewed automation output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/product-health.json
          git diff --cached --quiet || git commit -m "Maintain weekly product recommendations"
          git push
